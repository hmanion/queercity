name: Deploy to Ionos (SFTP)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: deploy-ionos
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy via SFTP mirror
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_PORT: ${{ secrets.IONOS_SFTP_PORT }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$IONOS_SFTP_HOST"
          test -n "$IONOS_SFTP_USER"
          test -n "$IONOS_SFTP_PASSWORD"
          if [ -z "$IONOS_SFTP_PORT" ]; then IONOS_SFTP_PORT=22; fi

          is_excluded() {
            local path="$1"
            case "$path" in
              .git/*|.github/*|scripts/*|csvimport/*|newsletter/output/*)
                return 0
                ;;
              .gitignore|allowlist-main.txt|allowlist-pages.txt|README.md|LICENSE|DATA_LICENSE.md|config/db.php|config/db.sample.php|schema.sql|output.json|directory.json)
                return 0
                ;;
            esac
            return 1
          }

          full_deploy() {
            lftp -u "$IONOS_SFTP_USER","$IONOS_SFTP_PASSWORD" "sftp://$IONOS_SFTP_HOST:$IONOS_SFTP_PORT" -e "\
              set sftp:auto-confirm yes; \
              set net:max-retries 2; \
              set net:reconnect-interval-base 5; \
              mirror -R --verbose --only-newer --delete \
                --exclude-glob .git/ \
                --exclude-glob .github/ \
                --exclude-glob .gitignore \
                --exclude-glob allowlist-*.txt \
                --exclude-glob README.md \
                --exclude-glob LICENSE \
                --exclude-glob DATA_LICENSE.md \
                --exclude-glob config/db.php \
                --exclude-glob config/db.sample.php \
                --exclude-glob scripts/ \
                --exclude-glob schema.sql \
                --exclude-glob csvimport/ \
                --exclude-glob output.json \
                --exclude-glob directory.json \
                --exclude-glob newsletter/output/ \
                ./ .; \
              bye"
          }

          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Running full deploy."
            full_deploy
            exit 0
          fi

          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Base commit $BEFORE is unavailable on runner; running full deploy."
            full_deploy
            exit 0
          fi

          mapfile -t DIFF_LINES < <(git diff --name-status --find-renames "$BEFORE" "$GITHUB_SHA")

          if [ "${#DIFF_LINES[@]}" -eq 0 ]; then
            echo "No changed files to deploy."
            exit 0
          fi

          BATCH_FILE="$(mktemp)"
          trap 'rm -f "$BATCH_FILE"' EXIT

          {
            echo "set sftp:auto-confirm yes"
            echo "set net:max-retries 2"
            echo "set net:reconnect-interval-base 5"
            echo "lcd $PWD"
            echo "cd ."
          } > "$BATCH_FILE"

          declare -A MADE_DIRS=()

          ensure_remote_dir() {
            local dir="$1"
            [ -z "$dir" ] && return 0
            if [ -n "${MADE_DIRS[$dir]+x}" ]; then
              return 0
            fi

            local current=""
            IFS='/' read -r -a parts <<< "$dir"
            for part in "${parts[@]}"; do
              [ -z "$part" ] && continue
              if [ -z "$current" ]; then
                current="$part"
              else
                current="$current/$part"
              fi
              if [ -z "${MADE_DIRS[$current]+x}" ]; then
                printf 'mkdir -p "%s"\n' "$current" >> "$BATCH_FILE"
                MADE_DIRS["$current"]=1
              fi
            done
          }

          remote_output_dir() {
            local dir="$1"
            if [ "$dir" = "." ] || [ -z "$dir" ]; then
              printf '.'
            else
              printf '%s' "$dir"
            fi
          }

          for line in "${DIFF_LINES[@]}"; do
            IFS=$'\t' read -r status path1 path2 <<< "$line"
            case "$status" in
              D*)
                if ! is_excluded "$path1"; then
                  printf 'rm -f "%s"\n' "$path1" >> "$BATCH_FILE"
                fi
                ;;
              R*|C*)
                if ! is_excluded "$path1"; then
                  printf 'rm -f "%s"\n' "$path1" >> "$BATCH_FILE"
                fi
                if ! is_excluded "$path2"; then
                  dir="$(dirname "$path2")"
                  [ "$dir" = "." ] || ensure_remote_dir "$dir"
                  printf 'put -O "%s" "%s"\n' "$(remote_output_dir "$dir")" "$path2" >> "$BATCH_FILE"
                fi
                ;;
              *)
                if ! is_excluded "$path1"; then
                  dir="$(dirname "$path1")"
                  [ "$dir" = "." ] || ensure_remote_dir "$dir"
                  printf 'put -O "%s" "%s"\n' "$(remote_output_dir "$dir")" "$path1" >> "$BATCH_FILE"
                fi
                ;;
            esac
          done

          echo "bye" >> "$BATCH_FILE"

          if [ "$(wc -l < "$BATCH_FILE")" -le 5 ]; then
            echo "No deployable file changes after exclusions."
            exit 0
          fi

          lftp -u "$IONOS_SFTP_USER","$IONOS_SFTP_PASSWORD" "sftp://$IONOS_SFTP_HOST:$IONOS_SFTP_PORT" -e "source $BATCH_FILE; bye"
