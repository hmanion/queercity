<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 590" role="img" aria-labelledby="gm-map-title gm-map-desc">
  <title id="gm-map-title">Greater Manchester Boroughs</title>
  <desc id="gm-map-desc">Interactive silhouettes of ten Greater Manchester boroughs.</desc>

  <!-- Wigan: borders Bolton and Salford -->
  <path id="borough-wigan" data-borough="wigan" d="M60 200 L105 160 L95 210 L130 255 L195 280 L205 350 L110 350 L60 300 Z" />

  <!-- Bolton: borders Wigan, Salford and Bury -->
  <path id="borough-bolton" data-borough="bolton" d="M130 130 L190 150 L225 225 L195 280 L130 255 L95 210 L105 160 Z" />

  <!-- Bury: borders Bolton, Salford, Manchester and Rochdale -->
  <path id="borough-bury" data-borough="bury" d="M210 95 L285 85 L355 170 L325 172 L338 160 L292 210 L225 225 L190 150 Z" />

  <!-- Rochdale: borders Bury, Manchester and Oldham -->
  <path id="borough-rochdale" data-borough="rochdale" d="M285 85 L395 92 L470 118 L455 170 L375 240 L355 170 Z" />

  <!-- Oldham: borders Rochdale, Manchester and Tameside -->
  <path id="borough-oldham" data-borough="oldham" d="M455 170 L535 225 L505 292 L440 260 L372 305 L375 240 Z" />

  <!-- Salford: borders Wigan, Bolton, Bury, Manchester and Trafford -->
  <path id="borough-salford" data-borough="salford" d="M325 172 L310 250 L280 320 L250 330 L205 350 L195 280 L225 225 L292 210 Z" />

  <!-- Trafford: borders Salford and Manchester (west of Manchester) -->
  <path id="borough-trafford" data-borough="trafford" d="M310 250 L316 410 L330 495 L275 500 L220 485 L190 430 L210 360 L250 330 L280 320 Z" />

  <!-- Manchester (long/thin): borders Trafford, Salford, Bury, Rochdale, Oldham, Tameside and Stockport -->
  <path id="borough-manchester" data-borough="manchester" d="M325 172 L355 170 L375 240 L372 305 L365 380 L350 455 L316 410 L310 250 Z" />

  <!-- Tameside: borders Oldham, Manchester and Stockport -->
  <path id="borough-tameside" data-borough="tameside" d="M372 305 L365 380 L410 395 L448 435 L500 365 L505 292 L440 260 Z" />

  <!-- Stockport: borders Manchester and Tameside (opposite Trafford) -->
  <path id="borough-stockport" data-borough="stockport" d="M365 380 L350 455 L340 530 L405 542 L470 508 L448 435 L410 395 Z" />
</svg>
